<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Kokpit Kampanii Meta</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme: light;
  --plane:#eef1f6; --plane-2:#e7ebf2;
  --surface:#ffffff; --surface-2:#f4f6fb; --inset:#eef1f7;
  --ink:#0d1526; --ink-2:#586074; --muted:#8b93a6;
  --line:rgba(13,21,38,.09); --line-2:rgba(13,21,38,.055);
  --accent:#2f6bff; --accent-2:#12b3a6; --accent-soft:rgba(47,107,255,.10);
  --glow-a:rgba(47,107,255,.14); --glow-b:rgba(18,179,166,.12);
  --good:#12a150; --good-ink:#0a7a3c; --good-soft:rgba(18,161,80,.12);
  --warn:#e08a00; --warn-ink:#9a5f00; --warn-soft:rgba(224,138,0,.13);
  --crit:#e0443f; --crit-ink:#b02b27; --crit-soft:rgba(224,68,63,.11);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#7c5cff; --s8:#e34948;
  --grid:#e7eaf1; --axis:#cfd4df;
  --shadow-s:0 1px 2px rgba(13,21,38,.05);
  --shadow:0 2px 6px rgba(13,21,38,.05), 0 12px 30px rgba(13,21,38,.06);
  --shadow-l:0 8px 40px rgba(13,21,38,.10);
  --r:18px; --r-s:12px; --r-xs:9px;
  --team-bdc:#12b3a6; --team-han:#2f6bff;
}
:root[data-theme="dark"], :root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme: dark;
  --plane:#080a0f; --plane-2:#0c0f16;
  --surface:#13161f; --surface-2:#1a1e28; --inset:#20242f;
  --ink:#f2f5fb; --ink-2:#9aa3b6; --muted:#6a7386;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.045);
  --accent:#5b8cff; --accent-2:#2fe0cd; --accent-soft:rgba(91,140,255,.14);
  --glow-a:rgba(91,140,255,.20); --glow-b:rgba(47,224,205,.13);
  --good:#2bc46a; --good-ink:#48d886; --good-soft:rgba(43,196,106,.15);
  --warn:#f0a52a; --warn-ink:#f6c15a; --warn-soft:rgba(240,165,42,.15);
  --crit:#f0605b; --crit-ink:#f5817d; --crit-soft:rgba(240,96,91,.16);
  --s1:#3987e5; --s2:#f0703a; --s3:#22c78a; --s4:#e6a520;
  --s5:#ec8fb2; --s6:#22a822; --s7:#9b83ff; --s8:#ef6b6a;
  --grid:#232833; --axis:#39404d;
  --shadow-s:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 2px 8px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.45);
  --shadow-l:0 10px 50px rgba(0,0,0,.55);
  --team-bdc:#2fe0cd; --team-han:#5b8cff;
}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#080a0f; --plane-2:#0c0f16;
  --surface:#13161f; --surface-2:#1a1e28; --inset:#20242f;
  --ink:#f2f5fb; --ink-2:#9aa3b6; --muted:#6a7386;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.045);
  --accent:#5b8cff; --accent-2:#2fe0cd; --accent-soft:rgba(91,140,255,.14);
  --glow-a:rgba(91,140,255,.20); --glow-b:rgba(47,224,205,.13);
  --good:#2bc46a; --good-ink:#48d886; --good-soft:rgba(43,196,106,.15);
  --warn:#f0a52a; --warn-ink:#f6c15a; --warn-soft:rgba(240,165,42,.15);
  --crit:#f0605b; --crit-ink:#f5817d; --crit-soft:rgba(240,96,91,.16);
  --s1:#3987e5; --s2:#f0703a; --s3:#22c78a; --s4:#e6a520;
  --s5:#ec8fb2; --s6:#22a822; --s7:#9b83ff; --s8:#ef6b6a;
  --grid:#232833; --axis:#39404d;
  --shadow-s:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 2px 8px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.45);
  --shadow-l:0 10px 50px rgba(0,0,0,.55);
  --team-bdc:#2fe0cd; --team-han:#5b8cff;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; scroll-behavior:smooth}
body{
  margin:0; background:var(--plane); color:var(--ink);
  font-family:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; letter-spacing:-.003em;
  position:relative; min-height:100vh;
}
body::before{content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(1100px 520px at 12% -6%, var(--glow-a), transparent 60%),
    radial-gradient(900px 500px at 96% 0%, var(--glow-b), transparent 55%);
}
h1,h2,h3,h4{font-family:"Sora", system-ui, sans-serif; margin:0; text-wrap:balance; letter-spacing:-.02em}
.mono{font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
::selection{background:var(--accent-soft)}

/* ---------- header ---------- */
header{position:sticky; top:0; z-index:40;
  background:color-mix(in srgb, var(--surface) 82%, transparent);
  backdrop-filter:saturate(1.6) blur(14px); -webkit-backdrop-filter:saturate(1.6) blur(14px);
  border-bottom:1px solid var(--line)}
.bar{max-width:1300px; margin:0 auto; padding:15px 24px; display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:13px; margin-right:auto; min-width:0}
.logo{width:42px; height:42px; border-radius:13px; flex:none; display:grid; place-items:center;
  color:#fff; font-family:"Sora"; font-weight:800; font-size:20px;
  background:linear-gradient(140deg, var(--accent), var(--accent-2));
  box-shadow:0 6px 18px -6px var(--accent), inset 0 1px 0 rgba(255,255,255,.35)}
.brand h1{font-size:18.5px; font-weight:700; line-height:1.05}
.brand .sub{font-size:11.5px; color:var(--muted); letter-spacing:.02em; margin-top:1px}
.tools{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.btn{font:inherit; font-size:12.5px; font-weight:500; color:var(--ink-2); background:var(--surface-2);
  border:1px solid var(--line); border-radius:10px; padding:8px 12px; cursor:pointer;
  display:inline-flex; align-items:center; gap:7px; white-space:nowrap; transition:.16s}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 55%, var(--line)); color:var(--ink); transform:translateY(-1px)}
.btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.seg{display:inline-flex; background:var(--inset); border:1px solid var(--line); border-radius:11px; padding:3px}
.seg button{font:inherit; font-size:12px; font-weight:500; border:0; background:transparent; color:var(--ink-2);
  padding:6px 12px; border-radius:8px; cursor:pointer; transition:.15s}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow-s); font-weight:600}

/* ---------- filters ---------- */
.filters{border-bottom:1px solid var(--line); background:color-mix(in srgb, var(--surface) 60%, transparent)}
.filters .bar{padding-top:12px; padding-bottom:12px; gap:14px 18px}
.field{display:flex; flex-direction:column; gap:5px}
.field label{font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:600}
select,input[type=search]{font:inherit; font-size:13px; color:var(--ink); background:var(--surface);
  border:1px solid var(--line); border-radius:10px; padding:8px 11px; min-width:150px; transition:.15s}
select:hover,input:hover{border-color:color-mix(in srgb,var(--accent) 40%, var(--line))}
select:focus,input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.presets{display:inline-flex; gap:5px; flex-wrap:wrap}
.chip{font:inherit; font-size:12px; font-weight:500; padding:7px 13px; border-radius:20px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink-2); cursor:pointer; transition:.15s}
.chip:hover{border-color:color-mix(in srgb,var(--accent) 45%, var(--line)); color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;
  box-shadow:0 4px 12px -4px var(--accent)}
.filterstate{margin-left:auto; font-size:12px; color:var(--muted); display:flex; align-items:center; gap:8px}
.filterstate b{color:var(--ink); font-weight:600}
.livedot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}

/* ---------- layout ---------- */
main{max-width:1300px; margin:0 auto; padding:26px 24px 10px}
.sec{margin:34px 2px 14px}
.eyebrow{font-size:10.5px; text-transform:uppercase; letter-spacing:.14em; color:var(--accent); font-weight:600; margin-bottom:5px}
.sec h2{font-size:20px; font-weight:700}
.sec .hint{font-size:13px; color:var(--muted); margin-top:3px; max-width:70ch}
.grid{display:grid; gap:16px}
.cols-2{grid-template-columns:1fr 1fr}
.cols-3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 18px 16px; box-shadow:var(--shadow); transition:transform .18s, box-shadow .18s}
.card.hoverlift:hover{transform:translateY(-2px); box-shadow:var(--shadow-l)}
.card h3{font-size:14.5px; font-weight:600; letter-spacing:-.01em}
.card .ch-sub{font-size:11.5px; color:var(--muted); margin-top:3px}
.card-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:14px}

/* KPI */
.kpis{grid-template-columns:repeat(6,1fr)}
.kpi{position:relative; overflow:hidden; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:16px 17px 15px; box-shadow:var(--shadow);
  display:flex; flex-direction:column; gap:7px; transition:transform .18s, box-shadow .18s}
.kpi:hover{transform:translateY(-2px); box-shadow:var(--shadow-l)}
.kpi.hero::after{content:""; position:absolute; right:-30px; top:-30px; width:120px; height:120px; border-radius:50%;
  background:radial-gradient(circle, var(--k-glow), transparent 70%); opacity:.9; pointer-events:none}
.kpi .label{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600}
.kpi .value{font-family:"Sora"; font-weight:800; font-size:32px; line-height:1; letter-spacing:-.03em}
.kpi .value small{font-size:15px; font-weight:600; color:var(--muted); letter-spacing:0}
.kpi .foot{font-size:11.5px; color:var(--ink-2); margin-top:auto}
.kpi .foot b{color:var(--ink); font-weight:600}
.tagbadge{align-self:flex-start; font-size:10.5px; font-weight:600; padding:2px 8px; border-radius:20px}
.b-good{background:var(--good-soft); color:var(--good-ink)} .b-crit{background:var(--crit-soft); color:var(--crit-ink)}
.b-warn{background:var(--warn-soft); color:var(--warn-ink)} .b-neut{background:var(--inset); color:var(--ink-2)}
.b-acc{background:var(--accent-soft); color:var(--accent)}

/* team split */
.teamflow{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px;
  padding:12px 16px; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-s)}
.teamflow .node{display:flex; align-items:center; gap:9px; font-size:12.5px}
.teamflow .nb{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;font-family:"Sora";font-weight:700;font-size:12px}
.teamflow .arrow{color:var(--muted); font-size:16px}
.teamflow small{color:var(--muted)}
.teamcard{position:relative; overflow:hidden}
.teamcard .tc-top{display:flex; align-items:center; gap:11px; margin-bottom:14px}
.teamcard .tc-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;font-family:"Sora";font-weight:700;font-size:15px}
.teamcard h3{font-size:16px}
.teamcard .tc-role{font-size:11.5px; color:var(--muted)}
.tstat{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:14px}
.tstat .ts{background:var(--surface-2); border:1px solid var(--line-2); border-radius:var(--r-xs); padding:11px 12px}
.tstat .ts .v{font-family:"Sora"; font-weight:700; font-size:22px; line-height:1}
.tstat .ts .l{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-top:5px}
.obar{height:12px; border-radius:7px; overflow:hidden; display:flex; background:var(--inset)}
.obar i{height:100%}
.olabels{display:flex; flex-wrap:wrap; gap:8px 14px; margin-top:9px; font-size:11.5px; color:var(--ink-2)}
.olabels span{display:inline-flex; align-items:center; gap:6px}

/* meter rows */
.rows{display:flex; flex-direction:column; gap:11px}
.row{display:grid; grid-template-columns:1fr auto; gap:5px 10px; align-items:center}
.row .rl{font-size:12.5px; color:var(--ink); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.row .rv{font-size:12px; color:var(--ink-2)} .row .rv b{color:var(--ink); font-weight:600}
.meter{grid-column:1/-1; height:9px; background:var(--inset); border-radius:6px; overflow:hidden; display:flex}
.meter i{height:100%; display:block; transition:width .5s cubic-bezier(.2,.7,.2,1)}
.leg{display:flex; flex-wrap:wrap; gap:9px 15px; font-size:11.5px; color:var(--ink-2)}
.leg span{display:inline-flex; align-items:center; gap:6px}
.dot{width:10px; height:10px; border-radius:4px; flex:none}

/* funnel */
.funnel{display:flex; flex-direction:column; gap:9px}
.fstep{display:grid; grid-template-columns:152px 1fr 150px; gap:13px; align-items:center}
.fstep .fl{font-size:12.5px; color:var(--ink-2); text-align:right}
.fbar-wrap{background:var(--inset); border-radius:10px; height:42px; overflow:hidden}
.fbar{height:100%; border-radius:10px; display:flex; align-items:center; padding:0 14px; color:#fff;
  font-family:"Sora"; font-weight:700; font-size:16px; min-width:46px;
  transition:width .6s cubic-bezier(.2,.7,.2,1)}
.fstep .fpct{font-size:11.5px; color:var(--ink-2); line-height:1.3} .fstep .fpct b{color:var(--ink); font-weight:600}

/* charts */
svg{display:block; width:100%; height:auto; overflow:visible}
.axis-txt{fill:var(--muted); font-size:10.5px; font-family:"IBM Plex Mono", monospace}
.gridline{stroke:var(--grid); stroke-width:1}
.baseline{stroke:var(--axis); stroke-width:1.4}
.linechips{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:12px}
.lchip{font:inherit; font-size:11.5px; font-weight:500; padding:5px 11px 5px 9px; border-radius:20px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink-2); cursor:pointer;
  display:inline-flex; align-items:center; gap:7px; transition:.15s}
.lchip:hover{border-color:var(--axis)}
.lchip .sw{width:11px; height:11px; border-radius:3px; flex:none; transition:.15s}
.lchip[aria-pressed="false"]{opacity:.5} .lchip[aria-pressed="false"] .sw{background:var(--muted)!important}
.lchip[aria-pressed="true"]{color:var(--ink); border-color:var(--axis); background:var(--surface-2)}

/* donut */
.donutwrap{display:flex; gap:18px; align-items:center; flex-wrap:wrap}

/* ranking */
.rank{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-2)}
.rank:last-child{border-bottom:0}
.rank .num{font-family:"Sora";font-weight:700;color:var(--muted);font-size:12px;width:18px;text-align:right}
.rank .rmain{min-width:0}
.rank .rname{font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:7px}
.rank .rsub{font-size:11px;color:var(--muted);margin-top:5px;display:flex;align-items:center;gap:9px}
.rank .rright{text-align:right}
.rank .big{font-family:"Sora";font-weight:700;font-size:16px}
.rank .small{font-size:11px;color:var(--muted)}
.spark{height:7px;border-radius:5px;background:var(--inset);overflow:hidden;display:flex;width:120px}
.spark i{height:100%}
.teamtag{font-size:9.5px;font-weight:700;letter-spacing:.03em;padding:1.5px 7px;border-radius:20px;text-transform:uppercase}
.tt-bdc{background:color-mix(in srgb,var(--team-bdc) 18%, transparent);color:var(--team-bdc)}
.tt-han{background:color-mix(in srgb,var(--team-han) 18%, transparent);color:var(--team-han)}

/* table */
.tablewrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--surface); box-shadow:var(--shadow)}
table{border-collapse:collapse; width:100%; font-size:12.5px; min-width:1000px}
thead th{position:sticky; top:0; background:var(--surface-2); text-align:left; padding:12px 13px;
  font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600;
  border-bottom:1px solid var(--line); cursor:pointer; white-space:nowrap; user-select:none}
thead th:hover{color:var(--ink)}
thead th .arr{opacity:.6; font-size:9px}
tbody td{padding:10px 13px; border-bottom:1px solid var(--line-2); vertical-align:top}
tbody tr:hover{background:var(--surface-2)}
.pill{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; white-space:nowrap}
.p-won{background:var(--good-soft); color:var(--good-ink)}
.p-lost{background:var(--crit-soft); color:var(--crit-ink)}
.p-open{background:var(--accent-soft); color:var(--accent)}
.p-none{background:var(--inset); color:var(--muted)}
.tag{font-family:"IBM Plex Mono", monospace; font-size:11px; color:var(--ink-2); background:var(--inset); padding:2px 7px; border-radius:6px}

/* insights */
.insights{grid-template-columns:repeat(2,1fr)}
.ins{position:relative; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-s);
  padding:16px 18px 15px 20px; box-shadow:var(--shadow); overflow:hidden}
.ins::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--accent)}
.ins.pos::before{background:var(--good)} .ins.neg::before{background:var(--crit)} .ins.warnb::before{background:var(--warn)}
.ins h4{margin:0 0 6px; font-size:14px; font-weight:600}
.ins p{margin:0; font-size:12.5px; color:var(--ink-2)}
.ins .metric{font-family:"Sora"; font-weight:700; font-size:15px; color:var(--ink)}

/* tooltip */
#tip{position:fixed; z-index:100; pointer-events:none; background:color-mix(in srgb,var(--surface) 96%, transparent);
  color:var(--ink); border:1px solid var(--line); border-radius:11px; padding:10px 12px; font-size:12px;
  box-shadow:var(--shadow-l); max-width:300px; opacity:0; transition:opacity .1s; line-height:1.5;
  backdrop-filter:blur(6px)}
#tip .tt-t{font-weight:700; margin-bottom:5px; font-family:"Sora"; font-size:12.5px}
#tip .tt-r{display:flex; justify-content:space-between; gap:16px}
#tip .tt-r b{font-variant-numeric:tabular-nums}
.hoverable{cursor:default; transition:filter .12s}
.hoverable:hover{filter:brightness(1.08)}
.empty{padding:34px; text-align:center; color:var(--muted); font-size:13px}
.recbar{display:flex; align-items:flex-start; gap:11px; margin-top:16px; padding:13px 16px;
  background:var(--warn-soft); border:1px solid color-mix(in srgb,var(--warn) 35%, transparent);
  border-radius:var(--r-s); font-size:12.5px; color:var(--ink)}
.recbar .ic{font-size:15px; line-height:1.2}
.recbar b{font-weight:700}
.recbar .rb-days{color:var(--ink-2); margin-top:3px}
/* heatmap status × osoba */
.hm-wrap{overflow-x:auto; margin:-2px}
table.hm{border-collapse:separate; border-spacing:3px; font-size:12px}
table.hm th,table.hm td{padding:7px 8px; text-align:center; white-space:nowrap; border-radius:7px}
table.hm thead th{color:var(--muted); font-weight:600; font-size:10.5px; vertical-align:bottom; line-height:1.25}
table.hm th.rowlab{position:sticky; left:0; z-index:2; background:var(--surface); text-align:left; color:var(--ink);
  font-weight:500; max-width:270px; overflow:hidden; text-overflow:ellipsis; font-size:12px}
table.hm thead th.corner{left:0; z-index:3; background:var(--surface); text-align:left; color:var(--muted)}
table.hm td.cell{font-variant-numeric:tabular-nums; color:var(--ink); min-width:34px; font-weight:500}
table.hm td.tot,table.hm th.tot{font-weight:700; color:var(--ink); background:var(--surface-2)}
table.hm tbody tr:hover th.rowlab{color:var(--accent)}
.hm-h{font-size:11.5px;font-weight:600}

footer{max-width:1300px; margin:14px auto 70px; padding:0 24px}
.method{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:22px 24px; box-shadow:var(--shadow)}
.method h3{font-family:"Sora"; font-size:15px; margin-bottom:10px}
.method ul{margin:8px 0 0; padding-left:20px; color:var(--ink-2)} .method li{margin:6px 0}
.notice{font-size:11px; color:var(--muted); margin-top:12px}

@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} html{scroll-behavior:auto} }
@media (max-width:1080px){ .kpis{grid-template-columns:repeat(3,1fr)} .insights,.cols-2,.cols-3{grid-template-columns:1fr} }
@media (max-width:720px){
  .kpis{grid-template-columns:repeat(2,1fr)} .fstep{grid-template-columns:80px 1fr; gap:9px}
  .fstep .fpct{grid-column:2; text-align:left} .fstep .fl{font-size:11px}
  .bar{padding:13px 15px} main{padding:18px 15px} .filterstate{display:none} .tstat{grid-template-columns:repeat(3,1fr)}
}
@media print{ header,.filters{position:static} .btn,.chip,.seg,.linechips{display:none} body{background:#fff} body::before{display:none} }
.fadein{animation:fade .5s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* password gate */
#gate{position:fixed; inset:0; z-index:200; display:grid; place-items:center; padding:24px;
  background:radial-gradient(1100px 520px at 12% -6%, var(--glow-a), transparent 60%),
    radial-gradient(900px 500px at 96% 0%, var(--glow-b), transparent 55%), var(--plane)}
.gatebox{width:100%; max-width:380px; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); box-shadow:var(--shadow-l); padding:32px 28px; text-align:center}
.gatebox .logo{margin:0 auto 16px}
.gatebox h1{font-size:20px; margin-bottom:6px}
.gatebox p{font-size:13px; color:var(--ink-2); margin:0 0 20px}
.gatebox input{width:100%; text-align:center; font-size:15px; padding:12px; margin-bottom:12px}
.gatebox button{width:100%; font:inherit; font-weight:600; font-size:14px; color:#fff; border:0;
  border-radius:10px; padding:12px; cursor:pointer; background:linear-gradient(140deg,var(--accent),var(--accent-2));
  box-shadow:0 8px 20px -8px var(--accent)}
.gatebox button:disabled{opacity:.6; cursor:default}
.pwerr{color:var(--crit-ink); font-size:12.5px; margin-top:10px; min-height:16px}
.gatefoot{font-size:11px;color:var(--muted);margin-top:18px}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">
      <div class="logo">M</div>
      <div>
        <h1>Kokpit Kampanii Meta</h1>
        <div class="sub">Gazda Group Katowice · leady Facebook × główny CRM</div>
      </div>
    </div>
    <div class="tools">
      <div class="seg" role="group" aria-label="Granulacja czasu">
        <button id="granWeek" aria-pressed="true">Tygodnie</button>
        <button id="granDay" aria-pressed="false">Dni</button>
      </div>
      <button class="btn" id="themeBtn" aria-label="Przełącz motyw">◐&nbsp;Motyw</button>
      <button class="btn" id="printBtn">⎙&nbsp;PDF</button>
    </div>
  </div>
  <div class="filters">
    <div class="bar">
      <div class="field"><label>Okres</label>
        <div class="presets" id="presets">
          <button class="chip" data-d="0" aria-pressed="true">Całość</button>
          <button class="chip" data-d="90" aria-pressed="false">90 dni</button>
          <button class="chip" data-d="30" aria-pressed="false">30 dni</button>
          <button class="chip" data-d="7" aria-pressed="false">7 dni</button>
        </div>
      </div>
      <div class="field"><label for="fMonth">Miesiąc</label>
        <select id="fMonth"><option value="">Wszystkie miesiące</option></select></div>
      <div class="field"><label for="fTeam">Zespół</label>
        <select id="fTeam">
          <option value="">Oba zespoły</option>
          <option value="BDC">BDC (pierwszy kontakt)</option>
          <option value="Handlowcy">Handlowcy</option>
        </select></div>
      <div class="field"><label for="fCamp">Kampania</label>
        <select id="fCamp"><option value="">Wszystkie kampanie</option></select></div>
      <div class="field"><label for="fPers">Prowadzący</label>
        <select id="fPers"><option value="">Wszyscy</option></select></div>
      <div class="field"><label for="fOut">Status</label>
        <select id="fOut">
          <option value="">Wszystkie</option>
          <option value="won">Sukces</option>
          <option value="open">W toku</option>
          <option value="lost">Utracone</option>
          <option value="incrm">W CRM</option>
          <option value="notcrm">Poza CRM</option>
        </select></div>
      <div class="field"><label for="fQ">Szukaj</label>
        <input type="search" id="fQ" placeholder="nr klienta, kampania…"></div>
      <div class="filterstate" id="fstate"></div>
    </div>
  </div>
</header>

<main id="app"></main>

<footer>
  <div class="method">
    <h3>Metodyka i źródła</h3>
    <div id="methodBody"></div>
    <p class="notice" id="genNote"></p>
  </div>
</footer>

<div id="tip" role="tooltip"></div>

<div id="gate">
  <div class="gatebox">
    <div class="logo">M</div>
    <h1>Kokpit Kampanii Meta</h1>
    <p>Raport chroniony hasłem — Gazda Group Katowice.</p>
    <input type="password" id="pw" placeholder="Hasło dostępu" autocomplete="current-password" aria-label="Hasło dostępu">
    <button id="pwbtn">Odblokuj</button>
    <div id="pwerr" class="pwerr" role="alert"></div>
    <div class="gatefoot">Dane są zaszyfrowane (AES-256). Bez hasła raport nie jest czytelny.</div>
  </div>
</div>

function b64bytes(s){ return Uint8Array.from(atob(s), c=>c.charCodeAt(0)); }
async function unlock(pw){
  const salt=b64bytes(ENC.s), iv=b64bytes(ENC.i), ct=b64bytes(ENC.c);
  const km=await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:ENC.it, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
  return JSON.parse(new TextDecoder().decode(pt));
}
async function tryLogin(){
  const btn=document.getElementById('pwbtn'), err=document.getElementById('pwerr');
  err.textContent=''; btn.disabled=true; btn.textContent='Odblokowuję…';
  try{ const data=await unlock(document.getElementById('pw').value);
    document.getElementById('gate').remove(); __boot(data);
  }catch(e){ err.textContent='Nieprawidłowe hasło.'; btn.disabled=false; btn.textContent='Odblokuj';
    const i=document.getElementById('pw'); i.select(); i.focus(); }
}
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('pwbtn').onclick=tryLogin;
  document.getElementById('pw').addEventListener('keydown',e=>{ if(e.key==='Enter') tryLogin(); });
  document.getElementById('pw').focus();
});

function isoWeek(d){
  const dt=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=(dt.getUTCDay()+6)%7; dt.setUTCDate(dt.getUTCDate()-day+3);
  const firstTh=new Date(Date.UTC(dt.getUTCFullYear(),0,4));
  const w=1+Math.round(((dt-firstTh)/86400000-3+((firstTh.getUTCDay()+6)%7))/7);
  return dt.getUTCFullYear()+'-W'+String(w).padStart(2,'0');
}
function weekStart(d){ const x=new Date(d); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); return x; }
function shortDate(d){ return d.toLocaleDateString('pl-PL',{day:'2-digit',month:'2-digit'}); }
function fmtDate(iso){ try{ return shortDate(parseD(iso)); }catch(e){ return iso; } }

function applyFilters(){
  const cut = (state.days && !state.month)? new Date(maxDate.getTime()-(state.days-1)*86400000) : null;
  const q = state.q.trim().toLowerCase();
  return ROWS.filter(r=>{
    if(state.month && r.date.slice(0,7)!==state.month) return false;
    if(cut && parseD(r.date) < cut) return false;
    if(state.team && r.team!==state.team) return false;
    if(state.campaign && r.campaign!==state.campaign) return false;
    if(state.person && r.prowadzacy!==state.person) return false;
    if(state.out==='won' && r.outcome!=='won') return false;
    if(state.out==='lost' && r.outcome!=='lost') return false;
    if(state.out==='open' && r.outcome!=='open') return false;
    if(state.out==='incrm' && !r.matched) return false;
    if(state.out==='notcrm' && r.matched) return false;
    if(q){ const hay=((r.klient_id||'')+' '+(r.campaign||'')+' '+(r.prowadzacy||'')).toLowerCase();
           if(!hay.includes(q)) return false; }
    return true;
  });
}

function bucketWith(r,gran){
  if(gran==='week'){ const ws=weekStart(parseD(r.date));
    return {key:isoWeek(parseD(r.date)), label:shortDate(ws), sort:ws.getTime()}; }
  return {key:r.date, label:shortDate(parseD(r.date)), sort:parseD(r.date).getTime()};
}
function bucketOf(r){ return bucketWith(r,state.gran); }

function aggregate(rows){
  const valid=rows.filter(r=>r.valid), matched=rows.filter(r=>r.matched);
  const won=matched.filter(r=>r.outcome==='won'), sale=matched.filter(r=>r.sale);
  const lost=matched.filter(r=>r.outcome==='lost'), open=matched.filter(r=>r.outcome==='open');
  const junk=rows.filter(r=>!r.valid);
  const reached=matched.filter(r=> r.code && !['13','01','02'].includes(r.code));
  const offer=matched.filter(r=> ['05','06','07','08','10','11','12'].includes(r.code));
  // campaigns
  const cmap={};
  valid.forEach(r=>{ (cmap[r.campaign]=cmap[r.campaign]||{campaign:r.campaign,leads:0,matched:0,won:0,lost:0,open:0}).leads++; });
  matched.forEach(r=>{ const c=cmap[r.campaign]; if(!c)return; c.matched++; c[r.outcome]++; });
  const campaigns=Object.values(cmap).map(c=>({...c,conv:pct(c.won,c.matched),mr:pct(c.matched,c.leads)})).sort((a,b)=>b.leads-a.leads);
  // people
  const pmap={};
  matched.forEach(r=>{ const p=r.prowadzacy||'—';
    (pmap[p]=pmap[p]||{person:p,team:r.team,matched:0,won:0,lost:0,open:0,sale:0}); pmap[p].matched++; pmap[p][r.outcome]++; if(r.sale)pmap[p].sale++; });
  const people=Object.values(pmap).map(p=>({...p,conv:pct(p.won,p.matched)})).sort((a,b)=>b.won-a.won||b.matched-a.matched);
  // teams
  const teams={}; ['BDC','Handlowcy'].forEach(t=>teams[t]={team:t,matched:0,won:0,lost:0,open:0,sale:0,reached:0,people:new Set()});
  matched.forEach(r=>{ const T=teams[r.team]; if(!T)return; T.matched++; T[r.outcome]++; if(r.sale)T.sale++;
    if(r.code&&!['13','01','02'].includes(r.code))T.reached++; T.people.add(r.prowadzacy); });
  // growth (weekly/daily, stacked by outcome)
  const gmap={};
  valid.forEach(r=>{ const b=bucketOf(r); const g=gmap[b.key]=gmap[b.key]||{...b,total:0,won:0,lost:0,open:0,notcrm:0};
    g.total++; if(!r.matched)g.notcrm++; else g[r.outcome]++; });
  const growth=Object.values(gmap).sort((a,b)=>a.sort-b.sort);
  // status / reasons / models
  const smap={}; matched.forEach(r=>{ smap[r.crm_status]=(smap[r.crm_status]||0)+1; });
  const statusDist=Object.entries(smap).map(([status,count])=>({status,count})).sort((a,b)=>a.status.localeCompare(b.status));
  const rmap={}; lost.forEach(r=>{ const k=r.reason||'—'; rmap[k]=(rmap[k]||0)+1; });
  const reasons=Object.entries(rmap).map(([reason,count])=>({reason,count})).sort((a,b)=>b.count-a.count);
  const mmap={}; matched.forEach(r=>{ const k=r.model||'—'; mmap[k]=(mmap[k]||0)+1; });
  const models=Object.entries(mmap).map(([model,count])=>({model,count})).sort((a,b)=>b.count-a.count).slice(0,10);
  const fbtag=matched.filter(r=>r.fbtag).length;
  return {rows,valid,matched,won,sale,lost,open,junk,reached,offer,campaigns,people,teams,growth,statusDist,reasons,models,
    attribution:{fbtag,other:matched.length-fbtag,pct:pct(fbtag,matched.length)}};
}

/* stable campaign color ordering (by global volume) */
const CAMP_ORDER=(()=>{ const t={}; ROWS.filter(r=>r.valid).forEach(r=>t[r.campaign]=(t[r.campaign]||0)+1);
  return Object.keys(t).sort((a,b)=>t[b]-t[a]); })();
const SERIES=['--s1','--s2','--s3','--s4','--s5','--s7','--s6','--s8'];
function campColor(name){ const i=CAMP_ORDER.indexOf(name); return `var(${SERIES[i%SERIES.length]})`; }

/* =============================== TOOLTIP =============================== */
const tip=document.getElementById('tip');
function showTip(html,x,y){ tip.innerHTML=html; tip.style.opacity='1';
  const w=tip.offsetWidth,h=tip.offsetHeight; let nx=x+15,ny=y+15;
  if(nx+w>innerWidth-8) nx=x-w-15; if(ny+h>innerHeight-8) ny=y-h-15;
  tip.style.left=nx+'px'; tip.style.top=ny+'px'; }
function hideTip(){ tip.style.opacity='0'; }
function bindTip(el,html){ el.classList.add('hoverable');
  el.addEventListener('mousemove',e=>showTip(html,e.clientX,e.clientY));
  el.addEventListener('mouseleave',hideTip); }

/* =============================== SVG HELPERS =============================== */
const SVGNS='http://www.w3.org/2000/svg';
function el(tag,attrs){ const e=document.createElementNS(SVGNS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const OUTCOLORS={won:'var(--good)',open:'var(--s1)',lost:'var(--crit)',notcrm:'var(--muted)'};
const OUTLABEL={won:'Sukces',open:'W toku',lost:'Utracone',notcrm:'Poza CRM'};
function smoothPath(pts){ if(pts.length<2) return pts.length?`M${pts[0][0]} ${pts[0][1]}`:'';
  let d=`M${pts[0][0]} ${pts[0][1]}`;
  for(let i=0;i<pts.length-1;i++){ const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    const c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
    const c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
    d+=` C${c1x} ${c1y} ${c2x} ${c2y} ${p2[0]} ${p2[1]}`; } return d; }

/* stacked growth bars */
function drawGrowth(host, growth){
  host.innerHTML='';
  if(!growth.length){ host.innerHTML='<div class="empty">Brak danych w wybranym zakresie</div>'; return; }
  const W=820,H=250, pad={l:32,r:10,t:14,b:32}, iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
  const maxV=Math.max(1,...growth.map(g=>g.total));
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,role:'img'});
  for(let i=0;i<=4;i++){ const v=Math.round(maxV*i/4), y=pad.t+ih-ih*i/4;
    svg.appendChild(el('line',{x1:pad.l,y1:y,x2:W-pad.r,y2:y,class:'gridline'}));
    const t=el('text',{x:pad.l-6,y:y+3,'text-anchor':'end',class:'axis-txt'}); t.textContent=v; svg.appendChild(t); }
  const n=growth.length, gap=n>26?1.2:4, bw=Math.max(3,(iw/n)-gap);
  const segs=['won','open','lost','notcrm'];
  growth.forEach((g,i)=>{
    const x=pad.l+i*(iw/n)+(iw/n-bw)/2; let yTop=pad.t+ih;
    segs.forEach(s=>{ const val=g[s]||0; if(!val)return; const hh=ih*val/maxV; yTop-=hh;
      svg.appendChild(el('rect',{x,y:yTop,width:bw,height:Math.max(1,hh-1),rx:2.5,fill:OUTCOLORS[s]})); });
    const hit=el('rect',{x:pad.l+i*(iw/n),y:pad.t,width:iw/n,height:ih,fill:'transparent'});
    bindTip(hit,`<div class="tt-t">${g.label}${state.gran==='week'?' · tydz.':''}</div>`+
      `<div class="tt-r"><span>Nowe leady</span><b>${g.total}</b></div>`+
      segs.filter(s=>g[s]).map(s=>`<div class="tt-r"><span style="color:${OUTCOLORS[s]}">${OUTLABEL[s]}</span><b>${g[s]}</b></div>`).join(''));
    svg.appendChild(hit);
    if(n<=16||i%Math.ceil(n/12)===0){ const t=el('text',{x:x+bw/2,y:H-pad.b+16,'text-anchor':'middle',class:'axis-txt'}); t.textContent=g.label; svg.appendChild(t); }
  });
  svg.appendChild(el('line',{x1:pad.l,y1:pad.t+ih,x2:W-pad.r,y2:pad.t+ih,class:'baseline'}));
  host.appendChild(svg);
}

/* per-campaign OVERLAPPING lines + total line; own week/day granularity */
const TOTAL_COLOR='var(--ink)';
function drawCampaignLines(chartHost, legendHost, rows){
  const gran=state.gran;
  const valid=rows.filter(r=>r.valid);
  // buckets across range (wg lokalnej granulacji)
  const bmap={}; valid.forEach(r=>{ const b=bucketWith(r,gran); bmap[b.key]=b; });
  const buckets=Object.values(bmap).sort((a,b)=>a.sort-b.sort);
  const bkeys=valid.map(r=>bucketWith(r,gran).key);   // cache klucza per wiersz (indeks == valid)
  const present=CAMP_ORDER.filter(c=> valid.some(r=>r.campaign===c));
  // sync selection
  [...lineSel].forEach(c=>{ if(!present.includes(c)) lineSel.delete(c); });
  if(lineSel.size===0) present.slice(0,5).forEach(c=>lineSel.add(c));
  // legenda: najpierw linia SUMY, potem kampanie (top 8)
  const chipCamps=present.slice(0,8);
  legendHost.innerHTML=
    `<button class="lchip ltotal" data-total="1" aria-pressed="${showTotal}">
       <span class="sw" style="background:${TOTAL_COLOR}"></span>Wszystkie (suma)</button>`+
    chipCamps.map(c=>`<button class="lchip" data-c="${esc(c)}" aria-pressed="${lineSel.has(c)}">
      <span class="sw" style="background:${campColor(c)}"></span>${esc(shortCamp(c))}</button>`).join('');
  legendHost.querySelectorAll('.lchip').forEach(ch=>ch.onclick=()=>{
    if(ch.dataset.total){ showTotal=!showTotal; }
    else { const c=ch.dataset.c; if(lineSel.has(c)){ lineSel.delete(c); } else lineSel.add(c); }
    drawCampaignLines(chartHost,legendHost,rows);
  });
  chartHost.innerHTML='';
  if(buckets.length<1){ chartHost.innerHTML='<div class="empty">Brak danych</div>'; return; }
  const idxOf={}; buckets.forEach((b,i)=>idxOf[b.key]=i);
  // seria per kampania
  const series=[...lineSel].map(c=>{ const vals=buckets.map(()=>0);
    valid.forEach((r,ri)=>{ if(r.campaign===c) vals[idxOf[bkeys[ri]]]++; });
    return {name:c, color:campColor(c), vals, total:false}; });
  // seria SUMA (wszystkie ważne leady, niezależnie od zaznaczenia kampanii)
  let totalSeries=null;
  if(showTotal){ const vals=buckets.map(()=>0); valid.forEach((r,ri)=>{ vals[idxOf[bkeys[ri]]]++; });
    totalSeries={name:'Wszystkie leady', color:TOTAL_COLOR, vals, total:true}; }
  const allSeries=[...series, ...(totalSeries?[totalSeries]:[])];
  const maxV=Math.max(1,...allSeries.flatMap(s=>s.vals));
  const W=820,H=250, pad={l:30,r:14,t:16,b:32}, iw=W-pad.l-pad.r, ih=H-pad.t-pad.b, n=buckets.length;
  const X=i=> pad.l+(n===1?iw/2:iw*i/(n-1)), Y=v=> pad.t+ih-ih*v/maxV;
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,role:'img'});
  const ticks=Math.min(4,maxV);
  for(let i=0;i<=ticks;i++){ const v=Math.round(maxV*i/(ticks||1)), y=Y(v);
    svg.appendChild(el('line',{x1:pad.l,y1:y,x2:W-pad.r,y2:y,class:'gridline'}));
    const t=el('text',{x:pad.l-6,y:y+3,'text-anchor':'end',class:'axis-txt'}); t.textContent=v; svg.appendChild(t); }
  // kampanie
  series.forEach(s=>{ const pts=s.vals.map((v,i)=>[X(i),Y(v)]);
    svg.appendChild(el('path',{d:smoothPath(pts),fill:'none',stroke:s.color,'stroke-width':2.2,'stroke-linejoin':'round','stroke-linecap':'round'}));
    if(n<=16) pts.forEach(p=> svg.appendChild(el('circle',{cx:p[0],cy:p[1],r:2.8,fill:s.color,stroke:'var(--surface)','stroke-width':1.5})) );
  });
  // linia sumy — grubsza, przerywana, nad kampaniami
  if(totalSeries){ const pts=totalSeries.vals.map((v,i)=>[X(i),Y(v)]);
    svg.appendChild(el('path',{d:smoothPath(pts),fill:'none',stroke:TOTAL_COLOR,'stroke-width':3.1,'stroke-dasharray':'7 4','stroke-linejoin':'round','stroke-linecap':'round',opacity:.9}));
    pts.forEach((p,i)=> (n<=16||i===n-1) && svg.appendChild(el('circle',{cx:p[0],cy:p[1],r:i===n-1?4:3,fill:TOTAL_COLOR,stroke:'var(--surface)','stroke-width':1.6})) );
    const last=pts[n-1]; const lt=el('text',{x:last[0]-7,y:Math.max(pad.t+11,last[1]-9),'text-anchor':'end',class:'axis-txt',style:'fill:var(--ink);font-weight:600'}); lt.textContent='Σ '+totalSeries.vals[n-1]; svg.appendChild(lt);
  }
  // x labels + hover
  buckets.forEach((b,i)=>{ if(n<=16||i%Math.ceil(n/12)===0){ const t=el('text',{x:X(i),y:H-pad.b+16,'text-anchor':'middle',class:'axis-txt'}); t.textContent=b.label; svg.appendChild(t);}
    const hw=(n>1?iw/(n-1):iw); const hit=el('rect',{x:X(i)-hw/2,y:pad.t,width:hw,height:ih,fill:'transparent'});
    bindTip(hit,`<div class="tt-t">${b.label}${gran==='week'?' · tydz.':''}</div>`+
      (totalSeries?`<div class="tt-r"><span style="color:var(--ink)">Wszystkie</span><b>${totalSeries.vals[i]}</b></div>`:'')+
      series.map(s=>`<div class="tt-r"><span style="color:${s.color}">${esc(shortCamp(s.name))}</span><b>${s.vals[i]}</b></div>`).join(''));
    svg.appendChild(hit); });
  svg.appendChild(el('line',{x1:pad.l,y1:pad.t+ih,x2:W-pad.r,y2:pad.t+ih,class:'baseline'}));
  chartHost.appendChild(svg);
}

/* donut */
function drawDonut(host, parts){
  host.innerHTML=''; const total=parts.reduce((s,p)=>s+p.v,0);
  const W=190,H=190,cx=95,cy=95,r=76,rin=50;
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,role:'img'});
  if(!total){ host.innerHTML='<div class="empty">Brak danych</div>'; return; }
  let a=-Math.PI/2;
  parts.forEach(p=>{ if(!p.v)return; const frac=p.v/total,a2=a+frac*2*Math.PI,big=frac>.5?1:0;
    const x1=cx+r*Math.cos(a),y1=cy+r*Math.sin(a),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
    const xi2=cx+rin*Math.cos(a2),yi2=cy+rin*Math.sin(a2),xi1=cx+rin*Math.cos(a),yi1=cy+rin*Math.sin(a);
    const path=el('path',{d:`M${x1} ${y1} A${r} ${r} 0 ${big} 1 ${x2} ${y2} L${xi2} ${yi2} A${rin} ${rin} 0 ${big} 0 ${xi1} ${yi1} Z`,fill:p.c});
    bindTip(path,`<div class="tt-t">${p.label}</div><div class="tt-r"><span>Leady</span><b>${p.v}</b></div><div class="tt-r"><span>Udział</span><b>${pct(p.v,total)}%</b></div>`);
    svg.appendChild(path); a=a2; });
  const c=el('text',{x:cx,y:cy-3,'text-anchor':'middle',style:'fill:var(--ink);font-family:Sora;font-weight:800;font-size:30px'}); c.textContent=total; svg.appendChild(c);
  const c2=el('text',{x:cx,y:cy+16,'text-anchor':'middle',class:'axis-txt'}); c2.textContent='leadów'; svg.appendChild(c2);
  host.appendChild(svg);
}

function meterListInner(items){ const max=Math.max(1,...items.map(i=>i.value));

    <span class="meter"><i style="width:${Math.max(2,100*i.value/max)}%;background:${i.color}"></i></span></div>`).join(''); }
function shortCamp(s){ return String(s).replace('Nowy Volkswagen','VW').replace('Nowy ','').replace('Volkswagen ','VW ').replace(' już','').slice(0,40); }

/* =============================== RENDER =============================== */

  <span class="label">${label}</span><span class="value">${value}</span>
  ${badge&&badge.tag?`<span class="tagbadge ${badge.cls}">${badge.tag}</span>`:''}
  <span class="foot">${foot||''}</span></div>`; }

    <div class="card hoverlift"><div class="card-head"><div><h3>Lejek sprzedażowy</h3><div class="ch-sub">udział względem wszystkich ważnych leadów</div></div></div><div id="funnel" class="funnel"></div></div>
    <div class="card hoverlift"><div class="card-head"><div><h3>Rozkład wyników</h3><div class="ch-sub">status wszystkich ważnych leadów FB</div></div></div>
      <div class="donutwrap"><div style="flex:0 0 190px" id="donut"></div><div class="leg" id="donutLeg" style="flex-direction:column;align-items:flex-start;gap:10px"></div></div></div>
  </div>`;

  /* GROWTH */
  html+=`<div class="sec"><div class="eyebrow">Dynamika</div><h2>Przyrost leadów w czasie</h2><div class="hint">Po lewej: nowe leady w kolejnych ${state.gran==='week'?'tygodniach':'dniach'} wg wyniku. Po prawej: porównanie kampanii z linią sumy wszystkich leadów — kliknij, aby wybrać kampanie.</div></div>`;
  html+=`<div class="grid cols-2">
    <div class="card hoverlift"><div class="card-head"><div><h3>Nowe leady na ${state.gran==='week'?'tydzień':'dzień'}</h3><div class="ch-sub">stos = wynik leada</div></div>
      <div class="leg">${['won','open','lost','notcrm'].map(s=>`<span><i class="dot" style="background:${OUTCOLORS[s]}"></i>${OUTLABEL[s]}</span>`).join('')}</div></div>
      <div id="growth"></div></div>
    <div class="card hoverlift"><div class="card-head"><div><h3>Leady wg kampanii — napływ w czasie</h3><div class="ch-sub">nakładające się linie + suma · kliknij, aby pokazać/ukryć</div></div></div>
      <div class="linechips" id="lineChips"></div><div id="campLines"></div></div>
  </div>`;

  /* CAMPAIGNS */
  html+=`<div class="sec"><div class="eyebrow">Kampanie</div><h2>Skuteczność kampanii</h2><div class="hint">${A.campaigns.length} kampanii w bieżącym widoku · sortowane wg liczby leadów.</div></div>`;
  html+=`<div class="grid cols-2">
    <div class="card hoverlift"><div class="card-head"><div><h3>Wolumen i jakość</h3><div class="ch-sub">słupek = leady · segmenty = wynik</div></div></div><div id="campBars"></div></div>
    <div class="card hoverlift"><div class="card-head"><div><h3>Konwersja wg kampanii</h3><div class="ch-sub">% sukcesów wśród dopasowanych (min. 3 leady w CRM)</div></div></div><div id="campConv" class="rows"></div></div>
  </div>`;

  /* PEOPLE */
  html+=`<div class="sec"><div class="eyebrow">Zespół</div><h2>Prowadzący — praca na leadach FB</h2><div class="hint">Wyniki osób na dopasowanych leadach z Facebooka. Etykieta pokazuje zespół.</div></div>`;
  html+=`<div class="grid cols-2">
    <div class="card hoverlift"><div class="card-head"><div><h3>Ranking prowadzących</h3><div class="ch-sub">wg liczby sukcesów, potem obłożenia</div></div></div><div id="people"></div></div>
    <div class="grid" style="gap:16px">
      <div class="card hoverlift"><div class="card-head"><div><h3>Statusy w CRM</h3><div class="ch-sub">dopasowane leady FB</div></div></div><div id="statusList" class="rows"></div></div>
      <div class="card hoverlift"><div class="card-head"><div><h3>Powody utraty</h3><div class="ch-sub">przyczyny rezygnacji / brak kontaktu</div></div></div><div id="reasons" class="rows"></div></div>
    </div>
  </div>`;

  /* STATUS × OSOBA (heatmapa) */
  html+=`<div class="sec"><div class="eyebrow">Szczegóły</div><h2>Statusy wg prowadzących</h2><div class="hint">Ile leadów w każdym statusie CRM przypada na daną osobę. Wiersz = status, kolumna = prowadzący, kolor = natężenie. Reaguje na filtry (np. zawęź do zespołu Handlowcy).</div></div>`;
  html+=`<div class="card hoverlift"><div id="statusPerson"></div></div>`;

  /* MODELS + ATTR */
  html+=`<div class="grid cols-2" style="margin-top:16px">
    <div class="card hoverlift"><div class="card-head"><div><h3>Zainteresowanie modelami</h3><div class="ch-sub">modele z dopasowanych szans</div></div></div><div id="models" class="rows"></div></div>
    <div class="card hoverlift"><div class="card-head"><div><h3>Atrybucja w CRM</h3><div class="ch-sub">czy lead FB oznaczony jest jako źródło Facebook</div></div></div><div id="attr"></div></div>
  </div>`;

  /* INSIGHTS */
  html+=`<div class="sec"><div class="eyebrow">Rekomendacje</div><h2>Wnioski i propozycje</h2><div class="hint">Automatyczne obserwacje na podstawie bieżących filtrów.</div></div>`;
  html+=`<div class="grid insights" id="insights"></div>`;

  /* TABLE */
  html+=`<div class="sec"><div class="eyebrow">Dane źródłowe</div><h2>Pełne zestawienie leadów</h2><div class="hint" id="tblCount"></div></div>`;
  html+=`<div class="tablewrap"><table id="tbl"><thead><tr>
    <th data-k="date">Data <span class="arr">▾</span></th><th data-k="klient_id">Nr klienta / tel.</th>
    <th data-k="campaign">Kampania</th><th data-k="outcome">Wynik</th><th data-k="crm_status">Status CRM</th>
    <th data-k="team">Zespół</th><th data-k="prowadzacy">Prowadzący</th><th data-k="model">Model</th><th data-k="akcja">Źródło w CRM</th>
  </tr></thead><tbody id="tbody"></tbody></table></div>`;

  app.innerHTML=html;

  drawTeams(document.getElementById('teamCards'),A.teams,nMatch);
  drawFunnel(document.getElementById('funnel'),nValid,nMatch,A.reached.length,A.offer.length,nWon);
  const donutParts=[{label:'Sukces',v:nWon,c:'var(--good)'},{label:'W toku',v:nOpen,c:'var(--s1)'},
    {label:'Utracone',v:nLost,c:'var(--crit)'},{label:'Poza CRM',v:nValid-nMatch,c:'var(--muted)'}];
  drawDonut(document.getElementById('donut'),donutParts);
  document.getElementById('donutLeg').innerHTML=donutParts.map(p=>`<span><i class="dot" style="background:${p.c}"></i>${p.label} — <b class="tnum">&nbsp;${p.v}</b> <span style="color:var(--muted)">(${pct(p.v,nValid)}%)</span></span>`).join('');
  drawGrowth(document.getElementById('growth'),A.growth);
  drawCampaignLines(document.getElementById('campLines'),document.getElementById('lineChips'),rows);
  drawCampaigns(document.getElementById('campBars'),A.campaigns);
  drawCampConv(document.getElementById('campConv'),A.campaigns);
  drawPeople(document.getElementById('people'),A.people);
  document.getElementById('statusList').innerHTML=A.statusDist.length?meterListInner(A.statusDist.map(s=>{const code=(s.status.match(/^(\d{2})/)||[])[1];
    return {label:s.status,value:s.count,color:WON.has(code)?'var(--good)':LOST.has(code)?'var(--crit)':'var(--s1)'};})):'<div class="empty">Brak danych</div>';
  document.getElementById('reasons').innerHTML=A.reasons.length?meterListInner(A.reasons.slice(0,8).map(r=>({label:r.reason==='—'?'(brak wpisanego powodu)':r.reason,value:r.count,color:'var(--crit)'}))):'<div class="empty">Brak utraconych w tym widoku</div>';
  document.getElementById('models').innerHTML=A.models.length?meterListInner(A.models.map(m=>({label:m.model==='—'?'(brak modelu)':m.model,value:m.count,color:'var(--s7)'}))):'<div class="empty">Brak danych</div>';
  drawAttr(document.getElementById('attr'),A.attribution);
  drawStatusPerson(document.getElementById('statusPerson'),A.matched);
  drawInsights(document.getElementById('insights'),A,{nValid,nMatch,nWon,nLost,matchRate,convWon,convAll});
  buildTable(rows);
}

function drawTeams(host,teams,totalMatched){
  const order=['BDC','Handlowcy'];
  const meta={BDC:{role:'Etap 1 · pierwszy kontakt',c:'var(--team-bdc)',ic:'1'},Handlowcy:{role:'Etap 2 · domknięcie sprzedaży',c:'var(--team-han)',ic:'2'}};
  host.innerHTML=order.map(t=>{ const T=teams[t],m=meta[t]; const tot=T.matched||0;
    const conv=pct(T.won,tot), reach=pct(T.reached,tot);
    const segs=[['won',T.won,'var(--good)'],['open',T.open,'var(--s1)'],['lost',T.lost,'var(--crit)']];
    const bar=segs.map(([k,v,c])=> v?`<i style="width:${100*v/(tot||1)}%;background:${c}"></i>`:'').join('');
    return `<div class="card teamcard hoverlift">
      <div class="tc-top"><div class="tc-ic" style="background:${m.c}">${m.ic}</div>
        <div><h3>${t}</h3><div class="tc-role">${m.role}</div></div>
        <div style="margin-left:auto;text-align:right"><div style="font-family:Sora;font-weight:800;font-size:24px">${tot}</div><div style="font-size:11px;color:var(--muted)">leadów FB</div></div></div>
      <div class="tstat">
        <div class="ts"><div class="v" style="color:var(--good-ink)">${T.won}</div><div class="l">Sukces${T.sale?` · ${T.sale} sprz.`:''}</div></div>
        <div class="ts"><div class="v">${reach}%</div><div class="l">Kontakt</div></div>
        <div class="ts"><div class="v" style="color:${conv>0?'var(--good-ink)':'var(--ink)'}">${conv}%</div><div class="l">Konwersja</div></div>
      </div>
      <div class="obar">${bar}</div>
      <div class="olabels">
        <span><i class="dot" style="background:var(--good)"></i>Sukces ${T.won}</span>
        <span><i class="dot" style="background:var(--s1)"></i>W toku ${T.open}</span>
        <span><i class="dot" style="background:var(--crit)"></i>Utracone ${T.lost}</span>
        <span style="color:var(--muted)">${T.people.size} os.</span>
      </div></div>`;
  }).join('');
}

function drawFunnel(host,v,m,reached,offer,won){
  const steps=[{l:'Leady FB (ważne)',n:v,c:'var(--s1)'},{l:'Trafiły do CRM',n:m,c:'var(--s7)'},
    {l:'Kontakt nawiązany',n:reached,c:'var(--s3)'},{l:'Oferta / jazda próbna',n:offer,c:'var(--s4)'},
    {l:'Zamówienie / sprzedaż',n:won,c:'var(--good)'}];
  const max=Math.max(1,v);
  host.innerHTML=steps.map((s,i)=>{ const w=Math.max(3,100*s.n/max),prev=i?steps[i-1].n:s.n,drop=i&&prev?Math.round(100*(prev-s.n)/prev):0;
    return `<div class="fstep"><span class="fl">${s.l}</span>
      <div class="fbar-wrap"><div class="fbar" style="width:${w}%;background:${s.c}">${s.n}</div></div>
      <span class="fpct"><b>${pct(s.n,v)}%</b> leadów${i?`<br>−${drop}% na etapie`:''}</span></div>`; }).join('');
}

function drawCampaigns(host,camps){
  const top=camps.slice(0,10); if(!top.length){host.innerHTML='<div class="empty">Brak kampanii</div>';return;}
  const max=Math.max(1,...top.map(c=>c.leads));
  host.innerHTML=`<div class="rows">`+top.map(c=>{
    const segs=[['won',c.won],['open',c.open],['lost',c.lost],['notcrm',c.leads-c.matched]];
    const bar=segs.map(([k,val])=> val?`<i style="width:${100*val/c.leads}%;background:${OUTCOLORS[k]}"></i>`:'').join('');
    return `<div class="row"><span class="rl" title="${esc(c.campaign)}">${esc(shortCamp(c.campaign))}</span>
      <span class="rv"><b>${c.leads}</b> lead · ${c.won} ✓</span>
      <span class="meter" style="width:${Math.max(8,100*c.leads/max)}%">${bar}</span></div>`; }).join('')+`</div>`;
  [...host.querySelectorAll('.row')].forEach((row,i)=>{ const c=top[i];
    bindTip(row,`<div class="tt-t">${esc(c.campaign)}</div>
      <div class="tt-r"><span>Leady</span><b>${c.leads}</b></div>
      <div class="tt-r"><span>W CRM</span><b>${c.matched} (${c.mr}%)</b></div>
      <div class="tt-r"><span style="color:var(--good)">Sukces</span><b>${c.won}</b></div>
      <div class="tt-r"><span style="color:var(--crit)">Utracone</span><b>${c.lost}</b></div>
      <div class="tt-r"><span>Konwersja</span><b>${c.conv}%</b></div>`); });
}
function drawCampConv(host,camps){
  const list=camps.filter(c=>c.matched>=3).sort((a,b)=>b.conv-a.conv).slice(0,10);
  if(!list.length){host.innerHTML='<div class="empty">Za mało danych (min. 3 leady w CRM)</div>';return;}
  const max=Math.max(1,...list.map(c=>c.conv));
  host.innerHTML=list.map(c=>`<div class="row"><span class="rl" title="${esc(c.campaign)}">${esc(shortCamp(c.campaign))}</span>
    <span class="rv"><b>${c.conv}%</b> · ${c.won}/${c.matched}</span>
    <span class="meter"><i style="width:${Math.max(3,100*c.conv/max)}%;background:${c.conv>0?'var(--good)':'var(--muted)'}"></i></span></div>`).join('');
}
function drawPeople(host,people){
  if(!people.length){host.innerHTML='<div class="empty">Brak przypisanych leadów FB</div>';return;}
  host.innerHTML=people.map((p,i)=>{ const tot=p.matched,w=100*p.won/tot,o=100*p.open/tot,l=100*p.lost/tot;
    const tt=p.team==='BDC'?'tt-bdc':'tt-han';
    return `<div class="rank"><span class="num">${i+1}</span>
      <div class="rmain"><div class="rname">${esc(p.person)} ${p.team&&p.team!=='—'?`<span class="teamtag ${tt}">${p.team}</span>`:''}</div>
        <div class="rsub"><span class="spark"><i style="width:${w}%;background:var(--good)"></i><i style="width:${o}%;background:var(--s1)"></i><i style="width:${l}%;background:var(--crit)"></i></span><span class="tnum">${p.matched} leadów</span></div></div>
      <div class="rright"><div class="big">${p.won}<span class="small"> ✓</span></div><div class="small">${p.conv}% konw.</div></div></div>`; }).join('');
  [...host.querySelectorAll('.rank')].forEach((row,i)=>{ const p=people[i];
    bindTip(row,`<div class="tt-t">${esc(p.person)} · ${p.team}</div>
      <div class="tt-r"><span>Leady FB</span><b>${p.matched}</b></div>
      <div class="tt-r"><span style="color:var(--good)">Sukces</span><b>${p.won}${p.sale?` (${p.sale} sprzedaż)`:''}</b></div>
      <div class="tt-r"><span style="color:var(--s1)">W toku</span><b>${p.open}</b></div>
      <div class="tt-r"><span style="color:var(--crit)">Utracone</span><b>${p.lost}</b></div>
      <div class="tt-r"><span>Konwersja</span><b>${p.conv}%</b></div>`); });
}
function drawAttr(host,a){
  host.innerHTML=`<div style="display:flex;gap:8px;height:46px;border-radius:12px;overflow:hidden;margin-bottom:14px">
      <div style="flex:${a.fbtag||1};background:var(--s1);display:grid;place-items:center;color:#fff;font-family:Sora;font-weight:700">${a.fbtag}</div>
      <div style="flex:${a.other||1};background:var(--warn);display:grid;place-items:center;color:#3a2600;font-family:Sora;font-weight:700">${a.other}</div></div>
    <div class="leg" style="flex-direction:column;gap:9px">
      <span><i class="dot" style="background:var(--s1)"></i>Oznaczone jako źródło FB — <b class="tnum">&nbsp;${a.fbtag}</b> (${a.pct}%)</span>
      <span><i class="dot" style="background:var(--warn)"></i>Inne źródło w CRM — <b class="tnum">&nbsp;${a.other}</b> (${(100-a.pct).toFixed(1)}%)</span></div>
    <p style="font-size:12px;color:var(--ink-2);margin:14px 0 0">Leady FB przypisane do innego źródła zaniżają raportowany ROI Facebooka — warto ujednolicić tagowanie (<span class="tag">fb_*</span> / <span class="tag">FB_Formularze_LeadAds</span>).</p>`;
}
function drawStatusPerson(host, matched){
  if(!matched.length){ host.innerHTML='<div class="empty">Brak dopasowanych leadów w tym widoku</div>'; return; }
  const pcount={}, teamMap={};
  matched.forEach(r=>{ const p=r.prowadzacy||'—'; pcount[p]=(pcount[p]||0)+1; teamMap[p]=r.team; });
  const people=Object.keys(pcount).sort((a,b)=>pcount[b]-pcount[a]);
  const scount={}; matched.forEach(r=>{ scount[r.crm_status]=(scount[r.crm_status]||0)+1; });
  const statuses=Object.keys(scount).sort();
  const m={}; statuses.forEach(s=>m[s]={});
  matched.forEach(r=>{ const p=r.prowadzacy||'—'; m[r.crm_status][p]=(m[r.crm_status][p]||0)+1; });
  const maxv=Math.max(1,...statuses.flatMap(s=>people.map(p=>m[s][p]||0)));
  let h='<div class="hm-wrap"><table class="hm"><thead><tr><th class="corner rowlab">Status \\ prowadzący</th>';
  people.forEach(p=>{ const t=teamMap[p]; const tt=t==='BDC'?'tt-bdc':'tt-han'; const tl=t==='BDC'?'BDC':'Handl.';
    h+=`<th title="${esc(p)} · ${esc(t||'')}"><span class="teamtag ${tt}">${tl}</span><br><span class="hm-h">${esc(p)}</span></th>`; });
  h+='<th class="tot">Σ</th></tr></thead><tbody>';
  statuses.forEach(s=>{ const code=(s.match(/^(\d{2})/)||[])[1];
    const dotc=WON.has(code)?'var(--good)':LOST.has(code)?'var(--crit)':'var(--s1)';
    h+=`<tr><th class="rowlab" title="${esc(s)}"><span class="dot" style="display:inline-block;background:${dotc};margin-right:7px;vertical-align:middle"></span>${esc(s)}</th>`;
    people.forEach(p=>{ const v=m[s][p]||0;
      if(!v){ h+='<td class="cell" style="color:var(--muted)">·</td>'; return; }
      const pctv=Math.round((0.14+0.76*v/maxv)*100); const txt=pctv>55?'#fff':'var(--ink)';
      h+=`<td class="cell" title="${esc(s)} — ${esc(p)}: ${v}" style="background:color-mix(in srgb, var(--accent) ${pctv}%, transparent);color:${txt}">${v}</td>`; });
    h+=`<td class="tot" title="Razem w statusie">${scount[s]}</td></tr>`; });
  h+='<tr><th class="rowlab tot">Σ wszystkie</th>';
  people.forEach(p=> h+=`<td class="tot" title="${esc(p)}: ${pcount[p]}">${pcount[p]}</td>`);
  h+=`<td class="tot">${matched.length}</td></tr></tbody></table></div>`;
  host.innerHTML=h;
}

function drawInsights(host,A,k){
  const ins=[]; const missing=k.nValid-k.nMatch;
  ins.push({cls:k.matchRate>=70?'pos':(k.matchRate>=50?'warnb':'neg'),h:'Pokrycie leadów w CRM',
    p:`<span class="metric">${k.matchRate}%</span> leadów FB (${k.nMatch}/${k.nValid}) trafiło do CRM. ${missing} nie znaleziono po telefonie — to potencjalnie <b>nieobsłużone</b> kontakty lub braki w rejestracji.`});
  ins.push({cls:k.convWon>=8?'pos':(k.convWon>=4?'warnb':'neg'),h:'Konwersja na zamówienie',
    p:`Sukcesem zakończyło się <span class="metric">${k.convWon}%</span> dopasowanych leadów (${k.nWon} z ${k.nMatch}); ${k.convAll}% wszystkich leadów FB.`});
  const bdc=A.teams.BDC,han=A.teams.Handlowcy;
  if(bdc.matched||han.matched) ins.push({cls:'warnb',h:'Przekazanie BDC → Handlowcy',
    p:`BDC obsłużyło <span class="metric">${bdc.matched}</span> leadów (kontakt ${pct(bdc.reached,bdc.matched)}%), handlowcy <span class="metric">${han.matched}</span> (konwersja ${pct(han.won,han.matched)}%). Sprawdź, czy tempo przekazywania leadów z BDC nie wydłuża czasu reakcji.`});
  const bc=A.campaigns.filter(c=>c.matched>=4).sort((a,b)=>b.conv-a.conv)[0];
  if(bc) ins.push({cls:'pos',h:'Najlepsza kampania',p:`<b>${esc(bc.campaign)}</b> — konwersja <span class="metric">${bc.conv}%</span> (${bc.won}/${bc.matched}) przy ${bc.leads} leadach. Warto skalować budżet.`});
  const wc=A.campaigns.filter(c=>c.leads>=8).sort((a,b)=>a.conv-b.conv)[0];
  if(wc) ins.push({cls:'neg',h:'Wysoki wolumen, niska jakość',p:`<b>${esc(wc.campaign)}</b>: ${wc.leads} leadów, tylko ${wc.won} sukces (${wc.conv}%). Zweryfikuj kreację/targetowanie i czas reakcji.`});
  const noContact=A.matched.filter(r=>r.code==='13').length;
  if(noContact) ins.push({cls:'warnb',h:'Brak kontaktu z klientem',p:`<span class="metric">${noContact}</span> leadów zamknięto jako „kontakt niemożliwy". To zwykle kwestia <b>czasu reakcji</b> — leady FB oddzwaniaj w minutach, nie dniach.`});
  host.innerHTML=ins.map(i=>`<div class="ins ${i.cls}"><h4>${i.h}</h4><p>${i.p}</p></div>`).join('');
}

let sortK='date',sortDir=-1;
function buildTable(rows){
  const tb=document.getElementById('tbody');
  const sorted=[...rows].sort((a,b)=>{ let x=a[sortK]??'',y=b[sortK]??''; if(x<y)return -sortDir; if(x>y)return sortDir; return 0; });
  document.getElementById('tblCount').textContent=`${sorted.length} rekordów w bieżącym widoku`;
  tb.innerHTML=sorted.slice(0,600).map(r=>{ const oc=r.matched?r.outcome:'none';
    const label={won:'Sukces',lost:'Utracone',open:'W toku',none:(r.status==='Junk/Test'?'Test/błąd':'Poza CRM')}[oc];
    const pc={won:'p-won',lost:'p-lost',open:'p-open',none:'p-none'}[oc];
    const tt=r.team==='BDC'?'<span class="teamtag tt-bdc">BDC</span>':r.team==='Handlowcy'?'<span class="teamtag tt-han">Handl.</span>':'<span style="color:var(--muted)">—</span>';
    return `<tr><td class="mono">${r.date}</td>
      <td class="mono">${r.klient_id?esc(r.klient_id):'<span style="color:var(--muted)">poza CRM</span>'}</td>
      <td title="${esc(r.campaign)}">${esc(shortCamp(r.campaign))}</td>
      <td><span class="pill ${pc}">${label}</span></td>
      <td>${r.crm_status?esc(r.crm_status):'<span style="color:var(--muted)">—</span>'}</td>
      <td>${tt}</td>
      <td>${r.prowadzacy?esc(r.prowadzacy):'<span style="color:var(--muted)">—</span>'}</td>
      <td>${r.model?esc(r.model):'<span style="color:var(--muted)">—</span>'}</td>
      <td>${r.akcja?`<span class="tag">${esc(r.akcja)}</span>`:'<span style="color:var(--muted)">—</span>'}</td></tr>`; }).join('')
    +(sorted.length>600?`<tr><td colspan="9" style="text-align:center;color:var(--muted);padding:14px">Pokazano 600 z ${sorted.length}. Zawęź filtry.</td></tr>`:'');
}
document.addEventListener('click',e=>{ const th=e.target.closest('th[data-k]'); if(!th)return;
  const k=th.dataset.k; if(k===sortK)sortDir*=-1; else {sortK=k; sortDir=(k==='date'?-1:1);}
  document.querySelectorAll('#tbl th .arr').forEach(a=>a.remove());
  const arr=document.createElement('span'); arr.className='arr'; arr.textContent=sortDir<0?'▾':'▴'; th.appendChild(arr);
  buildTable(applyFilters()); });

/* =============================== CONTROLS =============================== */
function fillSelect(id,vals){ const s=document.getElementById(id); const keep=s.querySelector('option').outerHTML;
  s.innerHTML=keep+vals.map(v=>`<option value="${esc(v.val!=null?v.val:v)}">${esc(v.txt!=null?v.txt:v)}</option>`).join(''); }
const allCampaigns=[...new Set(ROWS.filter(r=>r.valid).map(r=>r.campaign))].sort((a,b)=>a.localeCompare(b,'pl'));
const allPeople=[...new Set(ROWS.filter(r=>r.matched).map(r=>r.prowadzacy))].filter(Boolean).sort((a,b)=>a.localeCompare(b,'pl'));
const allMonths=[...new Set(ROWS.filter(r=>r.valid).map(r=>r.date.slice(0,7)))].sort().reverse()
  .map(m=>({val:m,txt:MONTHS_PL_CAP[+m.slice(5,7)-1]+' '+m.slice(0,4)}));
fillSelect('fCamp',allCampaigns); fillSelect('fPers',allPeople); fillSelect('fMonth',allMonths);

document.getElementById('fMonth').onchange=e=>{ state.month=e.target.value;
  if(state.month){ state.days=0; document.querySelectorAll('#presets .chip').forEach(c=>c.setAttribute('aria-pressed','false')); }
  render(); };
document.getElementById('fTeam').onchange=e=>{state.team=e.target.value; render();};
document.getElementById('fCamp').onchange=e=>{state.campaign=e.target.value; render();};
document.getElementById('fPers').onchange=e=>{state.person=e.target.value; render();};
document.getElementById('fOut').onchange=e=>{state.out=e.target.value; render();};
let qT; document.getElementById('fQ').oninput=e=>{ clearTimeout(qT); qT=setTimeout(()=>{state.q=e.target.value; render();},180); };
document.getElementById('presets').addEventListener('click',e=>{ const b=e.target.closest('.chip'); if(!b)return;
  [...e.currentTarget.children].forEach(c=>c.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true');
  state.days=+b.dataset.d; state.month=''; document.getElementById('fMonth').value=''; render(); });
function setGran(g){ state.gran=g; document.getElementById('granWeek').setAttribute('aria-pressed',g==='week');
  document.getElementById('granDay').setAttribute('aria-pressed',g==='day'); render(); }
document.getElementById('granWeek').onclick=()=>setGran('week');
document.getElementById('granDay').onclick=()=>setGran('day');
function currentTheme(){ return document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); }
document.getElementById('themeBtn').onclick=()=>{ const next=currentTheme()==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next); try{localStorage.setItem('meta_theme',next);}catch(e){} render(); };
try{ const t=localStorage.getItem('meta_theme'); if(t) document.documentElement.setAttribute('data-theme',t);}catch(e){}
document.getElementById('printBtn').onclick=()=>window.print();

render();
